<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主動式 ETF 持股變化比較</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: Arial, "Noto Sans TC", sans-serif;
            margin: 20px;
            background: #f5f5f5;
            color: #333;
        }

        h1 {
            margin-bottom: 8px;
        }

        .note {
            margin-bottom: 20px;
            color: #666;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        .title {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #eee;
        }

        .up {
            color: green;
            font-weight: bold;
        }

        .down {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>主動式 ETF 持股變化比較</h1>
    <div class="note">顯示各 ETF 今日與昨日持有股數有變化的成分股。</div>
    <div id="container"></div>

    <script>
        const ETF_LIST = [
            "00999A",
            "00981A",
            "00992A",
            "00982A",
        ];

        async function loadAllETF() {
            for (const etf of ETF_LIST) {
                await loadETF(etf);
            }
        }

        async function loadETF(etfCode) {
            const url = `data/latest_${etfCode}_compare_all.csv`;

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    console.log(`${etfCode} 沒有 compare_all CSV`);
                    return;
                }

                const csvText = await response.text();

                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: function (header) {
                        return header.replace(/^\uFEFF/, "").trim();
                    },
                    complete: function (results) {
                        renderTable(etfCode, results.data);
                    },
                });
            } catch (err) {
                console.log(err);
            }
        }

        function renderTable(etfCode, data) {
            if (data.length === 0) {
                return;
            }

            const container = document.getElementById("container");
            const card = document.createElement("div");
            card.className = "card";

            let html = `
                <div class="title">${etfCode}</div>
                <table>
                    <thead>
                        <tr>
                            <th>股票代號</th>
                            <th>股票名稱</th>
                            <th>昨日股數</th>
                            <th>今日股數</th>
                            <th>股數變化</th>
                            <th>昨日權重(%)</th>
                            <th>今日權重(%)</th>
                            <th>權重變化(%)</th>
                            <th>變化</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach((row) => {
                const shareDiff = Number(row["股數變化"]);
                const weightDiff = Number(row["權重變化(%)"]);
                const stockCode = pickValue(row, ["股票代號", "代號"]);
                const stockName = pickValue(row, ["股票名稱", "股票名稱_今日", "股票名稱_昨日", "名稱"]);
                let cls = "";

                if (shareDiff > 0 || (shareDiff === 0 && weightDiff > 0)) {
                    cls = "up";
                } else if (shareDiff < 0 || (shareDiff === 0 && weightDiff < 0)) {
                    cls = "down";
                }

                html += `
                    <tr>
                        <td>${stockCode}</td>
                        <td>${stockName}</td>
                        <td>${formatNumber(row["持有股數_昨日"])}</td>
                        <td>${formatNumber(row["持有股數_今日"])}</td>
                        <td class="${cls}">${formatNumber(row["股數變化"])}</td>
                        <td>${formatPercent(row["權重(%)_昨日"])}</td>
                        <td>${formatPercent(row["權重(%)_今日"])}</td>
                        <td class="${cls}">${formatPercent(row["權重變化(%)"])}</td>
                        <td class="${cls}">${row["變化"]}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            card.innerHTML = html;
            container.appendChild(card);
        }

        function formatNumber(value) {
            return Number(value || 0).toLocaleString();
        }

        function pickValue(row, keys) {
            for (const key of keys) {
                if (row[key] !== undefined && row[key] !== null && row[key] !== "") {
                    return row[key];
                }
            }

            return "";
        }

        function formatPercent(value) {
            return Number(value || 0).toLocaleString(undefined, {
                minimumFractionDigits: 0,
                maximumFractionDigits: 4,
            });
        }

        loadAllETF();
    </script>
</body>

</html>
