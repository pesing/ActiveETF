<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        主動ETF 每日加減碼追蹤
    </title>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>

        body{

            font-family:Arial;

            margin:20px;

            background:#f5f5f5;
        }

        h1{

            color:#333;
        }

        .card{

            background:white;

            padding:20px;

            margin-bottom:20px;

            border-radius:10px;

            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }

        .title{

            font-size:24px;

            margin-bottom:10px;

            font-weight:bold;
        }

        table{

            width:100%;

            border-collapse:collapse;
        }

        th,td{

            border:1px solid #ccc;

            padding:8px;

            text-align:center;
        }

        th{

            background:#eee;
        }

        .up{

            color:green;

            font-weight:bold;
        }

        .down{

            color:red;

            font-weight:bold;
        }

    </style>

</head>

<body>

    <h1>
        主動ETF 每日加減碼追蹤
    </h1>

    <div id="container"></div>

    <script>

        // ====================================
        // ETF清單
        // ====================================

        const ETF_LIST = [

            "00999A",
            "00981A",
            "00992A",
            "00982A"
        ];

        // ====================================
        // 載入全部ETF
        // ====================================

        async function loadAllETF(){

            for(const etf of ETF_LIST){

                await loadETF(etf);
            }
        }

        // ====================================
        // 載入ETF compare CSV
        // ====================================

        async function loadETF(etfCode){

            const url =

                `data/latest_${etfCode}_compare.csv`;

            console.log(url);

            try{

                const response =
                    await fetch(url);

                // 沒檔案
                if(!response.ok){

                    console.log(
                        `${etfCode} 無資料`
                    );

                    return;
                }

                const csvText =
                    await response.text();

                Papa.parse(

                    csvText,

                    {

                        header:true,

                        skipEmptyLines:true,

                        complete:function(results){

                            renderTable(

                                etfCode,

                                results.data
                            );
                        }
                    }
                );

            }catch(err){

                console.log(err);
            }
        }

        // ====================================
        // 顯示表格
        // ====================================

        function renderTable(

            etfCode,

            data
        ){

            if(data.length === 0){

                return;
            }

            const container =

                document.getElementById(
                    "container"
                );

            const card =

                document.createElement(
                    "div"
                );

            card.className = "card";

            let html = `

                <div class="title">

                    ${etfCode}

                </div>

                <table>

                    <thead>

                        <tr>

                            <th>股票代號</th>

                            <th>股票名稱</th>

                            <th>昨日股數</th>

                            <th>今日股數</th>

                            <th>股數變化</th>

                            <th>變化</th>

                        </tr>

                    </thead>

                    <tbody>
            `;

            data.forEach(row => {

                const diff = Number(
                    row["股數變化"]
                );

                let cls = "";

                if(diff > 0){

                    cls = "up";

                }else if(diff < 0){

                    cls = "down";
                }

                html += `

                    <tr>

                        <td>

                            ${row["股票代號"]}

                        </td>

                        <td>

                            ${row["股票名稱_今日"]}

                        </td>

                        <td>

                            ${Number(
                                row["持有股數_昨日"]
                            ).toLocaleString()}

                        </td>

                        <td>

                            ${Number(
                                row["持有股數_今日"]
                            ).toLocaleString()}

                        </td>

                        <td class="${cls}">

                            ${diff.toLocaleString()}

                        </td>

                        <td class="${cls}">

                            ${row["變化"]}

                        </td>

                    </tr>
                `;
            });

            html += `

                    </tbody>

                </table>
            `;

            card.innerHTML = html;

            container.appendChild(card);
        }

        // ====================================
        // 啟動
        // ====================================

        loadAllETF();

    </script>

</body>

</html>
