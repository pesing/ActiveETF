<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主動ETF 持股比較</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }

    h1 {
      color: #333;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #eee;
    }

    .up {
      color: green;
      font-weight: bold;
    }

    .down {
      color: red;
      font-weight: bold;
    }

    .nochange {
      color: gray;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <h1>主動ETF 前10持股比較</h1>

  <div class="card">
    <h3>上傳昨日 CSV</h3>
    <input type="file" id="yesterdayFile" accept=".csv">
  </div>

  <div class="card">
    <h3>上傳今日 CSV</h3>
    <input type="file" id="todayFile" accept=".csv">
  </div>

  <div class="card">
    <button onclick="compareCSV()">開始比較</button>
  </div>

  <div class="card">
    <h2>比較結果</h2>
    <table id="resultTable">
      <thead>
        <tr>
          <th>股票代號</th>
          <th>股票名稱</th>
          <th>昨日股數</th>
          <th>今日股數</th>
          <th>股數變化</th>
          <th>變化</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>

    function readCSV(file) {
      return new Promise((resolve) => {
        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            resolve(results.data);
          }
        });
      });
    }

    async function compareCSV() {

      const yesterdayFile = document.getElementById('yesterdayFile').files[0];
      const todayFile = document.getElementById('todayFile').files[0];

      if (!yesterdayFile || !todayFile) {
        alert('請選擇兩個CSV檔');
        return;
      }

      const yesterdayData = await readCSV(yesterdayFile);
      const todayData = await readCSV(todayFile);

      const yesterdayMap = {};

      yesterdayData.forEach(row => {

        const code = String(row['股票代號']);

        yesterdayMap[code] = {
          name: row['股票名稱'],
          shares: Number(row['持有股數']) || 0
        };
      });

      const tbody = document.querySelector('#resultTable tbody');

      tbody.innerHTML = '';

      todayData.forEach(row => {

        const code = String(row['股票代號']);

        const name = row['股票名稱'];

        const todayShares = Number(row['持有股數']) || 0;

        const yesterdayShares = yesterdayMap[code]
          ? yesterdayMap[code].shares
          : 0;

        const diff = todayShares - yesterdayShares;

        let changeText = '不變';
        let className = 'nochange';

        if (diff > 0) {
          changeText = '加碼';
          className = 'up';
        }

        if (diff < 0) {
          changeText = '減碼';
          className = 'down';
        }

        if (diff !== 0) {

          const tr = document.createElement('tr');

          tr.innerHTML = `
            <td>${code}</td>
            <td>${name}</td>
            <td>${yesterdayShares.toLocaleString()}</td>
            <td>${todayShares.toLocaleString()}</td>
            <td>${diff.toLocaleString()}</td>
            <td class="${className}">${changeText}</td>
          `;

          tbody.appendChild(tr);
        }
      });
    }

  </script>

</body>
</html>
